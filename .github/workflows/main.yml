name: Build Capacitor iOS IPA for TrollStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-capacitor:
    name: Build Capacitor iOS App (TrollStore)
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable 

      - name: Install npm dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Fix Xcode Asset Catalog Bug for TrollStore
        working-directory: ./ios/App
        run: |
          sed -i '' '/Assets.xcassets/d' App.xcodeproj/project.pbxproj
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;//g' App.xcodeproj/project.pbxproj
          
          # Force inject YagamiDownloadManager.swift into Xcode PBXBuildFile and PBXSourcesBuildPhase so it compiles
          # First, find the UUID of the Sources build phase (isa = PBXSourcesBuildPhase)
          SOURCES_UUID=$(awk '/isa = PBXSourcesBuildPhase;/ {print $1}' App.xcodeproj/project.pbxproj | head -n 1)
          
          # Generate fake UUIDs for the file reference and build file
          FILE_REF_UUID="YAGAMI000000000000000001"
          BUILD_FILE_UUID="YAGAMI000000000000000002"
          
          # Add the PBXFileReference
          sed -i '' "/\/\* End PBXFileReference section \*\//i\\
		$FILE_REF_UUID /* YagamiDownloadManager.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = YagamiDownloadManager.swift; sourceTree = \"<group>\"; };\\
" App.xcodeproj/project.pbxproj

          # Add the PBXBuildFile
          sed -i '' "/\/\* End PBXBuildFile section \*\//i\\
		$BUILD_FILE_UUID /* YagamiDownloadManager.swift in Sources */ = {isa = PBXBuildFile; fileRef = $FILE_REF_UUID /* YagamiDownloadManager.swift */; };\\
" App.xcodeproj/project.pbxproj

          # Add to the PBXGroup (App group) - finding the children array
          APP_GROUP_UUID=$(awk '/\/\* App \*\/ = {/ {print $1}' App.xcodeproj/project.pbxproj)
          sed -i '' "/$APP_GROUP_UUID \/\* App \*\/ = {/,/children = (/ s/children = (/children = (\\
				$FILE_REF_UUID \/\* YagamiDownloadManager.swift \*\/,/" App.xcodeproj/project.pbxproj

          # Add to the PBXSourcesBuildPhase
          sed -i '' "/$SOURCES_UUID \/\* Sources \*\/ = {/,/files = (/ s/files = (/files = (\\
				$BUILD_FILE_UUID \/\* YagamiDownloadManager.swift in Sources \*\/,/" App.xcodeproj/project.pbxproj
          
      - name: Build App (No Code Signing for TrollStore)
        working-directory: ./ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build | xcpretty

      - name: Package into IPA
        working-directory: ./ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r AudiophilePlayer-Capacitor-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiophilePlayer-Capacitor-TrollStore
          path: ios/App/AudiophilePlayer-Capacitor-TrollStore.ipa
