name: Build iOS IPA for TrollStore (100% Native)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-native:
    name: Build Native iOS App (TrollStore)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable 

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ./Yagami-Native-iOS
        run: xcodegen generate

      - name: Build App (No Code Signing for TrollStore)
        working-directory: ./Yagami-Native-iOS
        run: |
          set -o pipefail
          xcodebuild -project YagamiSwiftUI.xcodeproj \
            -scheme YagamiSwiftUI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            clean build | xcpretty

      - name: Package into IPA
        working-directory: ./Yagami-Native-iOS
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/YagamiSwiftUI.app Payload/
          zip -r AudiophilePlayer-Native-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiophilePlayer-Native-TrollStore
          path: Yagami-Native-iOS/AudiophilePlayer-Native-TrollStore.ipa
