name: Build Capacitor iOS IPA for TrollStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-capacitor:
    name: Build Capacitor iOS App (TrollStore)
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable 

      - name: Install npm dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Fix Xcode Asset Catalog Bug for TrollStore
        working-directory: ./ios/App
        run: |
          sed -i '' '/Assets.xcassets/d' App.xcodeproj/project.pbxproj
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;//g' App.xcodeproj/project.pbxproj

      - name: Build App (No Code Signing for TrollStore)
        working-directory: ./ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build | xcpretty

      - name: Package into IPA
        working-directory: ./ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r AudiophilePlayer-Capacitor-TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiophilePlayer-Capacitor-TrollStore
          path: ios/App/AudiophilePlayer-Capacitor-TrollStore.ipa
